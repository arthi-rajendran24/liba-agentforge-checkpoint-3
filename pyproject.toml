[project]
name = "agentforge-checkpoint-recovery"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
