[project]
name = "agentforge-checkpoint-recovery"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1,<2",
  "langchain-google-genai>=4,<5",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
